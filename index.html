<title>Solana General Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --void:#06080E; --panel:#111827; --panel2:#18202F; --line:#26304A; --line2:#3A4763;
  --ink:#EDF2FB; --ink2:#A8B6D0; --dim:#6A7893;
  --sol:#9945FF; --cy:#00D1FF; --gr:#14F195; --bad:#FF3B5C; --gold:#FFC53D;
}
*{box-sizing:border-box}
body{margin:0; background:var(--void); color:var(--ink); overflow-x:hidden;
  font-family:"Space Grotesk",system-ui,sans-serif; font-size:16px; line-height:1.5}
body::before{content:""; position:fixed; inset:0; z-index:-2;
  background:radial-gradient(ellipse 90% 60% at 50% -5%, #1B2A52 0%, #0A0F1C 55%, #05070C 100%)}
.wrap{max-width:760px; margin:0 auto; padding:0 16px 70px}

header{text-align:center; padding:36px 0 20px}
.cross{font-size:26px; color:var(--gr); filter:drop-shadow(0 0 16px rgba(20,241,149,.8))}
h1{font-family:Bungee,sans-serif; font-weight:400; font-size:clamp(26px,5.6vw,44px); margin:10px 0 0;
  background:linear-gradient(100deg,var(--gr),var(--cy) 50%,var(--sol));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.est{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.24em;
  text-transform:uppercase; color:var(--dim); margin-top:10px}

/* выбор теста */
.menu{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:26px}
@media(max-width:600px){ .menu{grid-template-columns:1fr} }
.tcard{position:relative; text-align:left; cursor:pointer; border-radius:18px; padding:22px;
  border:1px solid var(--line); background:linear-gradient(165deg,var(--panel2),var(--panel));
  transition:transform .18s, box-shadow .18s, border-color .18s}
.tcard:hover{transform:translateY(-4px); border-color:var(--gr);
  box-shadow:0 20px 46px -30px #000, 0 0 34px -14px rgba(20,241,149,.6)}
.tcard .ico{font-size:34px}
.tcard .tt{font-family:Bungee,sans-serif; font-size:19px; margin:10px 0 5px; line-height:1.15}
.tcard .td{font-size:14px; color:var(--ink2)}
.tcard .meta{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--dim); margin-top:12px}

/* тест */
.panel{border:1px solid var(--line); border-radius:18px; padding:24px;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); margin-top:22px}
.qnum{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--dim)}
.qtext{font-family:Bungee,sans-serif; font-size:clamp(19px,3.8vw,25px); margin:10px 0 20px; line-height:1.25}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{text-align:left; cursor:pointer; font:inherit; font-size:15.5px; font-weight:500; color:var(--ink);
  background:rgba(255,255,255,.035); border:1px solid var(--line2); border-radius:13px; padding:15px 17px;
  transition:transform .1s, border-color .15s, background .15s}
.opt:hover{border-color:var(--gr); background:rgba(20,241,149,.08); transform:translateX(4px)}
.opt:active{transform:translateX(4px) scale(.99)}
.pbar{height:6px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:18px}
.pbar i{display:block; height:100%; border-radius:99px; width:0%;
  background:linear-gradient(90deg,var(--sol),var(--gr)); transition:width .45s cubic-bezier(.2,1,.3,1)}

/* результат */
.res{text-align:center; animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0; transform:scale(.9)}to{opacity:1; transform:none}}
.remo{font-size:76px; line-height:1; filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.rname{font-family:Bungee,sans-serif; font-size:clamp(28px,7vw,48px); line-height:1.05; margin:12px 0 6px;
  background:linear-gradient(100deg,var(--gr),var(--cy),var(--sol));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.rtag{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--dim)}
.rdesc{color:var(--ink2); font-size:16px; margin:16px auto 0; max-width:32em}
.rstats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:1px; margin-top:22px;
  background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.rstats div{background:rgba(12,17,29,.9); padding:13px}
.rstats b{display:block; font-family:Bungee,sans-serif; font-size:20px; color:var(--gr)}
.rstats span{display:block; font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-top:4px}

/* dead or alive */
.coin{border:1px solid var(--line2); border-radius:16px; padding:20px; text-align:center;
  background:rgba(10,15,26,.7); animation:pop .4s ease-out}
.csym{font-family:Bungee,sans-serif; font-size:27px}
.cname{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--dim); margin-top:3px}
.cmet{display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:1px; margin-top:16px;
  background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.cmet div{background:rgba(12,17,29,.95); padding:10px}
.cmet b{display:block; font-family:"IBM Plex Mono",monospace; font-size:15px; font-variant-numeric:tabular-nums}
.cmet span{display:block; font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim); margin-top:3px}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:18px}
.big{font-family:Bungee,sans-serif; font-size:17px; padding:16px; border-radius:13px; border:none;
  cursor:pointer; transition:transform .09s}
.big:active{transform:translateY(2px)}
.b-dead{background:linear-gradient(100deg,#5A1020,var(--bad)); color:#fff}
.b-alive{background:linear-gradient(100deg,#0C4A32,var(--gr)); color:#04120C}
.verdict{text-align:center; margin-top:18px; animation:pop .4s ease-out}
.vbig{font-family:Bungee,sans-serif; font-size:30px}
.v-ok{color:var(--gr)} .v-no{color:var(--bad)}
.vwhy{color:var(--ink2); font-size:14.5px; margin-top:8px}

.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px}
button.act{font:inherit; font-family:Bungee,sans-serif; font-size:15px; cursor:pointer; border:none;
  border-radius:12px; padding:14px 24px; transition:transform .1s}
button.act:active{transform:translateY(2px)}
.b1{background:linear-gradient(100deg,var(--sol),var(--cy),var(--gr)); background-size:200% auto;
  color:#06080E; animation:sh 4s linear infinite}
@keyframes sh{0%{background-position:0%}100%{background-position:200%}}
.b2{background:rgba(255,255,255,.05); color:var(--ink2); border:1px solid var(--line2);
  font-family:"Space Grotesk",sans-serif; font-weight:600}
#fx{position:fixed; inset:0; pointer-events:none; z-index:60}
.foot{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); text-align:center;
  font-size:12px; color:var(--dim); line-height:1.9}
.foot a{color:var(--gr)}
.ca{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:12px}
.ca code{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink2); word-break:break-all}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <div class="cross">✚</div>
    <h1>SOLANA GENERAL HOSPITAL</h1>
    <p class="est">diagnostics department · walk-ins welcome</p>
  </header>

  <!-- меню -->
  <div id="menu">
    <div class="menu">
      <button class="tcard" data-t="degen">
        <div class="ico">🧠</div>
        <div class="tt">WHAT KIND OF DEGEN ARE YOU</div>
        <div class="td">Eight questions. One diagnosis. It will be accurate and you will not like it.</div>
        <div class="meta">8 questions · 6 possible diagnoses</div>
      </button>
      <button class="tcard" data-t="doa">
        <div class="ico">💀</div>
        <div class="tt">DEAD OR ALIVE</div>
        <div class="td">Real coins, born minutes ago. Look at the numbers and call it. Most people score under 50%.</div>
        <div class="meta">live from the chain · endless</div>
      </button>
    </div>
    <div class="panel" style="text-align:center">
      <div class="rstats" style="margin-top:0">
        <div><b id="m-taken">0</b><span>tests taken</span></div>
        <div><b id="m-doa">—</b><span>dead or alive accuracy</span></div>
        <div><b id="m-diag">none</b><span>last diagnosis</span></div>
      </div>
    </div>
  </div>

  <!-- тест -->
  <div id="quiz" class="hide"></div>

  <div class="foot">
    Crypto trading addiction is real and treated by real hospitals:
    <a href="https://www.castlecraig.co.uk/addictions-we-treat/behaviours/cryptocurrency-trading/" target="_blank" rel="noopener">Castle Craig</a> ·
    <a href="https://www.ifa.com/articles/what_science_crypto_trading_addiction_reveals" target="_blank" rel="noopener">26.3% of 596 traders met the clinical criteria</a>
    <div class="ca"><code id="ca">CA появится здесь после запуска</code><button class="b2 act" id="copyca" style="font-size:13px;padding:9px 16px">copy</button></div>
  </div>
</div>

<script>
/* ── конфетти ── */
var fx=document.getElementById("fx"), fc=fx.getContext("2d"), P=[];
function sz(){ fx.width=innerWidth; fx.height=innerHeight; } sz(); addEventListener("resize",sz);
function burst(n){ var c=["#9945FF","#14F195","#00D1FF","#FFC53D","#FF3B5C"];
  for(var i=0;i<n;i++) P.push({x:innerWidth/2,y:innerHeight/2.6,vx:(Math.random()-.5)*15,
    vy:(Math.random()-.95)*13,s:4+Math.random()*6,c:c[Math.floor(Math.random()*c.length)],l:1}); }
(function t(){ fc.clearRect(0,0,fx.width,fx.height); P=P.filter(function(p){return p.l>0;});
  P.forEach(function(p){ p.x+=p.vx;p.y+=p.vy;p.vy+=.44;p.l-=.012;
    fc.globalAlpha=Math.max(0,p.l); fc.fillStyle=p.c; fc.fillRect(p.x,p.y,p.s,p.s*1.5); });
  fc.globalAlpha=1; requestAnimationFrame(t); })();

/* ── память ── */
var K="sgh_tests";
var M = (function(){ try{ return JSON.parse(localStorage.getItem(K)||"null"); }catch(e){ return null; } })()
        || { taken:0, doaSeen:0, doaRight:0, lastDiag:"none" };
function saveM(){ try{ localStorage.setItem(K, JSON.stringify(M)); }catch(e){} }
function renderMenu(){
  document.getElementById("m-taken").textContent=M.taken;
  document.getElementById("m-doa").textContent = M.doaSeen ? Math.round(M.doaRight/M.doaSeen*100)+"%" : "—";
  document.getElementById("m-diag").textContent = M.lastDiag;
}

/* ═══ ТЕСТ 1: какой ты дегенерат ═══ */
var Q=[
 ["It is 4am. What are you doing?",
  [["Asleep like a normal person","ghost"],["Checking a chart","bag"],["Buying something that just launched","jeet"],
   ["Watching a wallet I track","sniper"],["Deploying","dev"]]],
 ["A coin you sold is now up 40x. Your move?",
  [["Block the ticker from my life","ghost"],["Stare at the chart for an hour","bag"],
   ["Buy back in immediately","jeet"],["Find who bought my bag","sniper"],["Launch a copy of it","dev"]]],
 ["Your wallet right now:",
  [["One or two positions","ghost"],["Forty tickers, all red","bag"],["Empty, I flipped everything","jeet"],
   ["Eleven wallets, actually","sniper"],["Fresh, funded from an exchange","dev"]]],
 ["Someone posts a coin with 3 holders. You:",
  [["Scroll past","ghost"],["Add it to a watchlist I never open","bag"],["Ape 0.5 SOL","jeet"],
   ["Check the dev wallet history","sniper"],["Note the narrative for later","dev"]]],
 ["How do you feel about the word 'bundle'?",
  [["No idea what that means","ghost"],["It is why I lost money","bag"],["It is why I sell in 4 seconds","jeet"],
   ["It is how I read a launch","sniper"],["It is a Tuesday","dev"]]],
 ["Your best trade ever was:",
  [["Not trading that week","ghost"],["Up 300%, I did not sell","bag"],["Up 20%, out in 9 seconds","jeet"],
   ["Block zero, obviously","sniper"],["The one where I was the seller","dev"]]],
 ["What is your relationship with the phrase 'it's not gambling'?",
  [["I have never said it","ghost"],["I said it to my partner","bag"],["I said it today","jeet"],
   ["I say it about other people","sniper"],["I say it to my buyers","dev"]]],
 ["Final question. Why are you here?",
  [["A friend sent the link","ghost"],["I recognised myself in the title","bag"],
   ["I am waiting for a chart to load in another tab","jeet"],["Research","sniper"],["Competitive analysis","dev"]]]
];
var TYPES={
 ghost:{e:"👻",n:"THE GHOST",t:"rare · genuinely fine",
   d:"You watch from a distance and sleep at night. Statistically you outperform everyone else on this page by doing nothing. Nobody believes you exist."},
 bag:{e:"🎒",n:"THE BAGHOLDER",t:"most common diagnosis",
   d:"You buy conviction and hold it into the ground. Your portfolio is a museum of narratives that were correct for about eleven minutes."},
 jeet:{e:"🏃",n:"THE JEET",t:"chronic · untreatable",
   d:"In and out before the chart renders. You have sold nine 100x coins for a 12% gain and you will do it again tonight."},
 sniper:{e:"🎯",n:"THE SNIPER",t:"cold blooded",
   d:"You read wallets, not narratives. You know what block zero means and you have opinions about Jito. The market fears you slightly."},
 dev:{e:"🧑‍🔬",n:"THE DEV",t:"the other side of the trade",
   d:"You are not a patient here, you are the reason there are patients here. Your wallet has a history and every sniper has seen it."},
 tourist:{e:"🧳",n:"THE TOURIST",t:"arrived by accident",
   d:"You gave answers from five different people. You do not know what you are yet, which is the most dangerous stage."}
};

function runDegen(){
  var i=0, tally={};
  function step(){
    var q=document.getElementById("quiz");
    if(i>=Q.length){
      var best="tourist", max=0, spread=0;
      for(var k in tally){ spread++; if(tally[k]>max){ max=tally[k]; best=k; } }
      if(max<3 && spread>=4) best="tourist";
      var T=TYPES[best];
      M.taken++; M.lastDiag=T.n; saveM(); burst(120);
      q.innerHTML='<div class="panel res">'+
        '<div class="remo">'+T.e+'</div>'+
        '<div class="rname">'+T.n+'</div>'+
        '<div class="rtag">'+T.t+'</div>'+
        '<p class="rdesc">'+T.d+'</p>'+
        '<div class="rstats">'+
          '<div><b>'+max+'/8</b><span>answers matched</span></div>'+
          '<div><b>'+Object.keys(tally).length+'</b><span>types in you</span></div>'+
          '<div><b>26.3%</b><span>of traders are clinically addicted</span></div>'+
        '</div>'+
        '<div class="row">'+
          '<button class="act b1" id="post">POST DIAGNOSIS</button>'+
          '<button class="act b2" id="again">Take it again</button>'+
          '<button class="act b2" id="home">← other tests</button>'+
        '</div></div>';
      document.getElementById("post").onclick=function(){
        var txt="I was diagnosed at Solana General Hospital.\n\n"+T.e+" "+T.n+"\n\""+T.d.split(".")[0]+".\"\n\nGet your diagnosis:";
        open("https://twitter.com/intent/tweet?text="+encodeURIComponent(txt),"_blank","noopener");
      };
      document.getElementById("again").onclick=function(){ runDegen(); };
      document.getElementById("home").onclick=home;
      renderMenu(); return;
    }
    var qq=Q[i];
    q.innerHTML='<div class="panel">'+
      '<div class="qnum">question '+(i+1)+' of '+Q.length+'</div>'+
      '<div class="qtext">'+qq[0]+'</div><div class="opts" id="o"></div>'+
      '<div class="pbar"><i style="width:'+(i/Q.length*100)+'%"></i></div></div>';
    var o=document.getElementById("o");
    qq[1].forEach(function(a){
      var b=document.createElement("button"); b.className="opt"; b.textContent=a[0];
      b.onclick=function(){ tally[a[1]]=(tally[a[1]]||0)+1; i++; step(); };
      o.appendChild(b);
    });
  }
  show(); step();
}

/* ═══ ТЕСТ 2: dead or alive ═══ */
var pool=[], used={};
async function refill(){
  try{
    var r=await fetch("https://lite-api.jup.ag/tokens/v2/recent"), j=await r.json();
    var l=(Array.isArray(j)?j:(j.tokens||[])).map(function(c){
      var fp=(c.firstPool||{}).createdAt, born=fp?Date.parse(fp):Date.now(), s=c.stats24h||{};
      return {id:c.id,sym:(c.symbol||"???").slice(0,12),name:(c.name||"").slice(0,30),
        mins:Math.max(1,Math.round((Date.now()-born)/60000)),h:c.holderCount||0,
        mc:c.mcap||0,liq:c.liquidity||0,vol:(s.buyVolume||0)+(s.sellVolume||0),org:c.organicScore||0};
    }).filter(function(t){ return !used[t.id]; });
    pool=pool.concat(l);
  }catch(e){}
}
function alive(t){
  var s=0;
  if(t.h>=40)s+=2; else if(t.h>=15)s+=1; else if(t.h<=3)s-=2;
  if(t.vol>=20000)s+=2; else if(t.vol>=4000)s+=1; else if(t.vol<600)s-=2;
  if(t.liq>=15000)s+=1; else if(t.liq<1200)s-=1;
  if(t.org>=25)s+=2; else if(t.org<=1)s-=1;
  if(t.mc>=25000)s+=1;
  return s>0;
}
async function runDoa(){
  show();
  var q=document.getElementById("quiz");
  if(pool.length<2) { q.innerHTML='<div class="panel res"><div class="remo">⏳</div><p class="rdesc">Pulling fresh bodies from the chain…</p></div>'; await refill(); }
  if(!pool.length){ q.innerHTML='<div class="panel res"><div class="remo">📡</div><p class="rdesc">The chain is not answering. Try again in a moment.</p><div class="row"><button class="act b2" id="home">← back</button></div></div>';
    document.getElementById("home").onclick=home; return; }
  var t=pool.shift(); used[t.id]=1;
  q.innerHTML='<div class="panel">'+
    '<div class="qnum">real coin · born '+t.mins+' min ago · call it</div>'+
    '<div class="coin"><div class="csym">$'+t.sym+'</div><div class="cname">'+(t.name||"unnamed")+'</div>'+
      '<div class="cmet">'+
        '<div><b>'+t.h+'</b><span>holders</span></div>'+
        '<div><b>$'+Math.round(t.mc).toLocaleString()+'</b><span>mcap</span></div>'+
        '<div><b>$'+Math.round(t.liq).toLocaleString()+'</b><span>liquidity</span></div>'+
        '<div><b>$'+Math.round(t.vol).toLocaleString()+'</b><span>volume</span></div>'+
      '</div>'+
      '<div class="duo"><button class="big b-dead" id="d">DEAD 💀</button>'+
      '<button class="big b-alive" id="a">ALIVE 🫀</button></div>'+
    '</div><div id="v"></div></div>';
  function answer(said){
    var real=alive(t), ok=(said===real);
    M.doaSeen++; if(ok){ M.doaRight++; burst(50); } saveM();
    var acc=Math.round(M.doaRight/M.doaSeen*100);
    document.getElementById("d").disabled=true; document.getElementById("a").disabled=true;
    document.getElementById("v").innerHTML='<div class="verdict">'+
      '<div class="vbig '+(ok?"v-ok":"v-no")+'">'+(ok?"CORRECT":"WRONG")+'</div>'+
      '<div class="vwhy">It was <b>'+(real?"alive":"dead")+'</b>. '+
        (real? t.h+" holders and $"+Math.round(t.vol).toLocaleString()+" of volume - somebody other than the dev was buying."
             : t.h+" holders, $"+Math.round(t.vol).toLocaleString()+" volume. Nobody came.")+'</div>'+
      '<div class="rstats" style="margin-top:16px">'+
        '<div><b>'+acc+'%</b><span>your accuracy</span></div>'+
        '<div><b>'+M.doaRight+'/'+M.doaSeen+'</b><span>correct calls</span></div>'+
      '</div>'+
      '<div class="row"><button class="act b1" id="nx">NEXT BODY</button>'+
      '<button class="act b2" id="post2">POST SCORE</button>'+
      '<button class="act b2" id="home">← other tests</button></div></div>';
    document.getElementById("nx").onclick=runDoa;
    document.getElementById("home").onclick=home;
    document.getElementById("post2").onclick=function(){
      var txt="I scored "+acc+"% at telling dead coins from live ones at Solana General Hospital ("+M.doaRight+"/"+M.doaSeen+").\n\nReal coins, straight off the chain. Try it:";
      open("https://twitter.com/intent/tweet?text="+encodeURIComponent(txt),"_blank","noopener");
    };
    renderMenu();
  }
  document.getElementById("d").onclick=function(){ answer(false); };
  document.getElementById("a").onclick=function(){ answer(true); };
  if(pool.length<3) refill();
}

/* ── навигация ── */
function show(){ document.getElementById("menu").classList.add("hide");
  document.getElementById("quiz").classList.remove("hide"); scrollTo({top:0,behavior:"instant"}); }
function home(){ document.getElementById("quiz").classList.add("hide");
  document.getElementById("menu").classList.remove("hide"); renderMenu(); scrollTo({top:0,behavior:"instant"}); }
document.querySelectorAll(".tcard").forEach(function(c){
  c.onclick=function(){ c.dataset.t==="degen" ? runDegen() : runDoa(); };
});
document.getElementById("copyca").onclick=function(){
  var t=document.getElementById("ca").textContent, b=this;
  var ok=function(){ var o=b.textContent; b.textContent="copied"; setTimeout(function(){ b.textContent=o; },1400); };
  try{ navigator.clipboard.writeText(t).then(ok,ok); }catch(e){ ok(); }
};
renderMenu(); refill();
</script>
